config_version: '3.0'
name: 经典·顺手版
author: 风花絮
style:
  auto_caps: false
  candidate_corner_radius: 12
  candidate_font: []
  candidate_padding: 7
  candidate_spacing: 0.5
  candidate_text_size: 20
  candidate_view_height: 34
  comment_font: []
  comment_height: 12
  comment_position: right
  comment_vertical_bias: 0.0
  comment_text_size: 12
  hanb_font: []
  horizontal_gap: 1
  key_border: 1
  key_font: []
  key_height: 54
  key_hint_offset_x: 0
  key_long_text_size: 16
  key_text_size: 22
  key_width: 10.0
  label_text_size: 22
  label_font: []
  latin_font: []
  keyboard_height: 208
  keyboard_height_land: 160
  keyboard_padding_bottom: 0
  keyboard_padding_land_bottom: 0
  key_symbol_offset_x: 0
  popup_font: []
  popup_width: 45
  popup_height: 50
  popup_bottom_margin: 68
  popup_key_height: 48
  popup_text_size: 23
  reset_ascii_mode_on_focus_change: true
  round_corner: 5
  shadow_radius: 0.0
  symbol_font: []
  symbol_text_size: 10
  text_font: []
  vertical_gap: 3
  enter_label_mode: 0
  enter_labels:
    go: ➢
    done: ic@check
    next: ic@keyboard_return
    pre: ic@keyboard_return
    search: ic@magnify
    send: ➢
    default: ic@keyboard_return
  preview_font: []
preedit:
  horizontal_padding: 12
  top_end_radius: 0
  foreground:
    font_size: 22
window:
  insets:
    vertical: 6
    horizontal: 6
  item_padding:
    vertical: 6
    horizontal: 8
  foreground:
    label_font_size: 20
    text_font_size: 22
    comment_font_size: 16
fallback_colors:
  candidate_text_color: text_color
  popup_back_color: back_color
